<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roster Pengawas CLS</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#F2F3F5}header{background:#FFC107;padding:20px}.card{background:#fff;margin:12px;border-radius:16px;padding:14px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee;gap:10px;align-items:center}button{width:100%;padding:14px;border:0;border-radius:14px;font-weight:700;font-size:16px;cursor:pointer}.btn-yellow{background:#FFC107}.btn-green{background:#34A853;color:#fff}.btn-red{background:#EA4335;color:#fff}select,input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:6px 0}.tabs{display:flex;gap:8px;margin:12px;flex-wrap:wrap}.tabs button{background:#fff;border:1px solid #ddd;width:auto;padding:10px 14px}.tabs button.active{background:#111;color:#fff}.loginBox{background:#fff;border-radius:20px;padding:24px;text-align:center;max-width:420px;margin:40px auto}.logo{width:90px;height:90px;background:#FFC107;border-radius:24px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}.hidden{display:none!important}</style></head><body><div id="loginPage"><div class="loginBox"><div class="logo">CLS</div><h2>ROSTER PENGAWAS</h2><p>PT. CLS - Database Railway</p><input id="user" placeholder="Husin / NIK"><input id="pass" type="password" placeholder="Password"><button class="btn-yellow" onclick="doLogin()">MASUK</button><p style="font-size:13px;color:#777">Admin: Husin / 232323<br>Pengawas: NIK / 123456</p><p id="loginError" style="color:red"></p></div></div><div id="appPage" class="hidden"><header><h1>ROSTER PENGAWAS</h1><div><span id="totalTxt"></span> - Login: <b id="whoTxt"></b> (<span id="roleTxt"></span>)</div><input type="date" id="tanggal" value="2026-11-16"><div class="tabs"><button id="tabHarian" class="active" onclick="setMode('harian')">Harian</button><button id="tabMingguan" onclick="setMode('mingguan')">Mingguan</button><button id="tabAdmin" onclick="setMode('admin')">Admin Setting</button><button id="tabKelola" onclick="setMode('kelola')">Kelola Pengawas</button><button onclick="location.reload()" style="background:#EA4335;color:#fff;width:auto">Logout</button></div></header><div id="viewHarian"></div><div id="viewMingguan" style="display:none"></div><div id="viewAdmin" style="display:none"></div><div id="viewKelola" style="display:none"></div></div><script>let pengawas=[],rosterMap={},mode='harian',currentUser=null,currentRole=null;let posisiList=['SHIFT1-PIC','SHIFT1-HRM','SHIFT1-ROM A6+G','SHIFT1-ROM T','SHIFT1-MUARA','SHIFT2-PIC','SHIFT2-HRM','SHIFT2-ROM A6+G','SHIFT2-ROM T','SHIFT2-MUARA','OFF','CUTI'];async function loadData(){let r=await fetch('/api/data');let d=await r.json();pengawas=d.pengawas.filter(p=>p.role!=='admin');rosterMap={};d.roster.forEach(x=>{let t=x.tanggal.slice(0,10);if(!rosterMap[t])rosterMap[t]={};rosterMap[t][x.nik]=x.posisi;});render();}async function doLogin(){let u=document.getElementById('user').value.trim();let p=document.getElementById('pass').value.trim();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user:u,pass:p})});let d=await r.json();if(!d.ok){document.getElementById('loginError').innerText='Username / Password salah!';return;}currentUser=d.user.nama;currentRole=d.user.role;document.getElementById('loginPage').classList.add('hidden');document.getElementById('appPage').classList.remove('hidden');document.getElementById('whoTxt').innerText=currentUser;document.getElementById('roleTxt').innerText=currentRole==='admin'?'ADMIN':'PENGAWAS';if(currentRole!=='admin'){document.getElementById('tabAdmin').style.display='none';document.getElementById('tabKelola').style.display='none';}loadData();}function getTgl(){return document.getElementById('tanggal').value}function setMode(m){mode=m;['Harian','Mingguan','Admin','Kelola'].forEach(x=>{let el=document.getElementById('tab'+x);if(el)el.classList.toggle('active',x.toLowerCase()===m)});render();}function renderHarian(){let tgl=getTgl();let r=rosterMap[tgl]||{};let html='<div class="card"><h3>SHIFT 1 - SIANG</h3>';['PIC','HRM','ROM A6+G','ROM T','MUARA'].forEach(a=>{let o=pengawas.find(p=>r[p.id]==='SHIFT1-'+a);html+='<div class="row"><span>'+a+'</span><b>'+(o?o.nama:'- KOSONG -')+'</b></div>'});html+='</div><div class="card"><h3>SHIFT 2 - MALAM</h3>';['PIC','HRM','ROM A6+G','ROM T','MUARA'].forEach(a=>{let o=pengawas.find(p=>r[p.id]==='SHIFT2-'+a);html+='<div class="row"><span>'+a+'</span><b>'+(o?o.nama:'- KOSONG -')+'</b></div>'});html+='</div><div class="card"><h3>OFF / CUTI</h3>';pengawas.forEach(p=>{if(r[p.id]==='OFF'||r[p.id]==='CUTI')html+='<div class="row"><span>'+p.nama+'</span><b>'+r[p.id]+'</b></div>'});html+='</div>';document.getElementById('viewHarian').innerHTML=html;}function renderMingguan(){let base=new Date(getTgl());let html='';for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);let key=d.toISOString().slice(0,10);let r=rosterMap[key]||{};let s1=pengawas.find(p=>r[p.id]==='SHIFT1-PIC');let s2=pengawas.find(p=>r[p.id]==='SHIFT2-PIC');html+='<div class="card"><h3>'+d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})+'</h3><div class="row"><span>Shift 1 PIC</span><b>'+(s1?s1.nama:'- KOSONG -')+'</b></div><div class="row"><span>Shift 2 PIC</span><b>'+(s2?s2.nama:'- KOSONG -')+'</b></div><button onclick="document.getElementById(\'tanggal\').value=\''+key+'\';setMode(\'harian\')">Lihat Detail ></button></div>'}document.getElementById('viewMingguan').innerHTML=html;}function renderAdmin(){let tgl=getTgl();let r=rosterMap[tgl]||{};let html='<div class="card"><h3>Setting Roster - '+tgl+'</h3>';pengawas.forEach(p=>{html+='<div class="row"><span><b>'+p.nama+'</b><br><small>'+p.id+'</small></span><select onchange="setPos(\''+tgl+'\',\''+p.id+'\',this.value)"><option value="">-- Pilih --</option>'+posisiList.map(pos=>'<option '+(r[p.id]===pos?'selected':'')+'>'+pos+'</option>').join('')+'</select></div>'});html+='<button class="btn-yellow" onclick="copyKemarin()">Copy Dari Kemarin</button><br><br><button class="btn-green" onclick="alert(\'Tersimpan di Database Railway!\');loadData()">SIMPAN & SYNC</button></div>';document.getElementById('viewAdmin').innerHTML=html;}async function setPos(tgl,nik,val){await fetch('/api/roster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tanggal:tgl,nik,posisi:val})});if(!rosterMap[tgl])rosterMap[tgl]={};rosterMap[tgl][nik]=val;}async function copyKemarin(){let d=new Date(getTgl());d.setDate(d.getDate()-1);let from=d.toISOString().slice(0,10);await fetch('/api/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from,to:getTgl()})});loadData();alert('Berhasil copy dari '+from);}function renderKelola(){let html='<div class="card"><h3>Tambah Pengawas Baru</h3><input id="newNama" placeholder="Nama Lengkap"><input id="newNik" placeholder="NIK"><button class="btn-yellow" onclick="tambahPengawas()">+ TAMBAH</button></div>';pengawas.forEach(p=>{html+='<div class="card"><div class="row"><span><b>'+p.nama+'</b><br><small>'+p.id+'</small></span><span>'+p.status+'</span></div><button class="btn-red" onclick="hapusPengawas(\''+p.id+'\')">Non-Aktifkan</button></div>'});document.getElementById('viewKelola').innerHTML=html;}async function tambahPengawas(){let n=document.getElementById('newNama').value.trim();let nik=document.getElementById('newNik').value.trim();await fetch('/api/pengawas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:nik,nama:n})});loadData();alert('Berhasil tambah!');}async function hapusPengawas(id){if(confirm('Non-aktifkan?')){await fetch('/api/pengawas/off',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});loadData();}}function render(){document.getElementById('totalTxt').innerText=pengawas.length+' Pengawas';['Harian','Mingguan','Admin','Kelola'].forEach(x=>document.getElementById('view'+x).style.display=(x.toLowerCase()===mode?'block':'none'));if(mode==='harian')renderHarian();if(mode==='mingguan')renderMingguan();if(mode==='admin')renderAdmin();if(mode==='kelola')renderKelola();}document.getElementById('tanggal').addEventListener('change',render);</script></body></html>
